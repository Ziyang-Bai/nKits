name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Run host tests
        run: make test

      - name: Set up Ndless
        id: ndless
        uses: Ziyang-Bai/setup-ndless@v1
        with:
          ndless-ref: e52415fb568e92cd36ed049067b3e9c2727b84af
      - name: Prepare build metadata
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "NKITS_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "NKITS_VERSION=nightly" >> "$GITHUB_ENV"
          else
            echo "NKITS_VERSION=dev" >> "$GITHUB_ENV"
          fi
          echo "NKITS_COMMIT=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "NKITS_STAGE=Alpha Testing" >> "$GITHUB_ENV"


      - name: Package nSee notices
        run: |
          cd nSee
          zip nsee-notices.zip LICENSE README.md third_party/libjpeg/README third_party/libpng/png.h

      - name: Build calculator packages
        run: make VERSION="$NKITS_VERSION" COMMIT="$NKITS_COMMIT" STAGE="$NKITS_STAGE"

      - name: Upload calculator packages
        uses: actions/upload-artifact@v7
        with:
          name: nKits-${{ env.NKITS_VERSION }}-${{ env.NKITS_COMMIT }}
          path: |
            nHex/nhex.tns
            nEdit/nedit.tns
            nUSB/nusb.tns
            nUSB/tools/nusb-diag.tns
            nClock/nclock.tns
            nClock/tools/nclock-diag.tns
            nCapture/ncapture.tns
            nProtect/nprotect.tns
            nHide/nhide.tns
            ThemeEditor/themeeditor.tns
            TaskManager/taskmanager.tns
            nTexts/nTexts.tns
            nSee/nsee.tns
            LICENSE
            nSee/nsee-notices.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: nKits ${{ env.NKITS_VERSION }} - Alpha Testing
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Alpha Testing build of nKits from ${{ github.repository }}@${{ github.sha }}.

            Download the individual .tns files below. Source is available at the tagged revision. Copyright and license notices are in the corresponding source files; LICENSE and the nSee notices archive are attached.
          files: |
            nHex/nhex.tns
            nEdit/nedit.tns
            nUSB/nusb.tns
            nUSB/tools/nusb-diag.tns
            nClock/nclock.tns
            nClock/tools/nclock-diag.tns
            nCapture/ncapture.tns
            nProtect/nprotect.tns
            nHide/nhide.tns
            ThemeEditor/themeeditor.tns
            TaskManager/taskmanager.tns
            nTexts/nTexts.tns
            LICENSE
            nSee/nsee.tns
            nSee/nsee-notices.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  nightly:
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download calculator packages
        uses: actions/download-artifact@v8
        with:
          pattern: nKits-*
          path: packages
          merge-multiple: true

      - name: Update nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          latest="$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skipping nightly for superseded commit $GITHUB_SHA"
            exit 0
          fi

          release_id="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "nightly") | .id')"
          if [[ -z "$release_id" ]]; then
            gh release create nightly --draft --target "$GITHUB_SHA" --prerelease \
              --latest=false --title Nightly
          fi

          shopt -s globstar nullglob
          files=(packages/**/*.tns)
          gh release upload nightly "${files[@]}" packages/LICENSE packages/nSee/nsee-notices.zip --clobber

          {
            echo "Unstable nKits tools built from $GH_REPO@$GITHUB_SHA."
            echo
            echo "This prerelease is updated automatically after successful default-branch builds."
            echo
            for file in "${files[@]}"; do
              name="${file##*/}"
              printf -- '- [%s](https://github.com/%s/releases/download/nightly/%s)\n' \
                "$name" "$GH_REPO" "$name"
            done
            echo
            echo "Source and build instructions: https://github.com/$GH_REPO/tree/$GITHUB_SHA"
          } > "$RUNNER_TEMP/nightly-notes.md"

          tag="$(gh api "repos/$GH_REPO/git/matching-refs/tags/nightly" \
            --jq '.[] | select(.ref == "refs/tags/nightly") | .object.sha')"
          if [[ -n "$tag" ]]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
              -f "sha=$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/nightly -f "sha=$GITHUB_SHA"
          fi
          gh release edit nightly --draft=false --prerelease --latest=false --title Nightly \
            --notes-file "$RUNNER_TEMP/nightly-notes.md"
