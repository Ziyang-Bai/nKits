name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Run host tests
        run: make test

      - name: Set up Ndless
        id: ndless
        uses: Ziyang-Bai/setup-ndless@v1
      - name: Prepare build metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "NKITS_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "NKITS_VERSION=dev" >> "$GITHUB_ENV"
          fi
          echo "NKITS_COMMIT=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "NKITS_STAGE=Alpha Testing" >> "$GITHUB_ENV"


      - name: Build calculator packages
        run: make VERSION="$NKITS_VERSION" COMMIT="$NKITS_COMMIT" STAGE="$NKITS_STAGE"

      - name: Upload calculator packages
        uses: actions/upload-artifact@v7
        with:
          name: nKits-${{ env.NKITS_VERSION }}-${{ env.NKITS_COMMIT }}
          path: |
            nHex/nhex.tns
            nEdit/nedit.tns
            nClock/nclock.tns
            nCapture/ncapture.tns
            LICENSE
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: nKits ${{ env.NKITS_VERSION }} - Alpha Testing
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Alpha Testing release of nKits for Ndless-enabled TI-Nspire CX/CX II calculators. Includes nHex, nEdit, nClock and nCapture calculator packages. Adds a resident clock and countdown, plus system screenshots with preview and Save As. The programs display version ${{ env.NKITS_VERSION }}, Alpha Testing, and build commit ${{ env.NKITS_COMMIT }} on their About or status pages. Licensed under the GNU General Public License v3.0; the complete license is attached and corresponding source is available from commit ${{ env.NKITS_COMMIT }}. Original nClock and nCapture copyright and license notices are retained.
          files: |
            nHex/nhex.tns
            nEdit/nedit.tns
            nClock/nclock.tns
            nCapture/ncapture.tns
            LICENSE
          fail_on_unmatched_files: true
